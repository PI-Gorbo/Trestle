# Builds the Trestle playground (`apps/demo`) as a static site.
#
# Two stages, deliberately separate: the WebAssembly compiler is built from
# `crates/trestle-wasm`, then the Nuxt app is generated. The app builds either way — with no
# wasm package it falls back to its mock compiler — which is what keeps this workflow useful
# while the compiler itself is still being fixed.

name: demo

on:
  push:
    branches: [main]
    paths: ['apps/demo/**', 'crates/**', '.github/workflows/demo.yml']
  pull_request:
    paths: ['apps/demo/**', 'crates/**', '.github/workflows/demo.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/demo/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: jetli/wasm-pack-action@v0.4.0

      - run: pnpm install --frozen-lockfile

      # TODO: remove `continue-on-error` once `cargo check --workspace` passes.
      #
      # At the time this workflow was written `crates/trestle` does not compile (a
      # half-finished `FunctionInvocation` refactor), so this step will fail and the site is
      # published running its mock compiler. Once the compiler builds, drop the flag so a
      # broken wasm build fails the deploy loudly instead of silently shipping the mock.
      - name: Build the WebAssembly compiler
        continue-on-error: true
        run: pnpm build:wasm

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: demo-static
          path: apps/demo/.output/public
