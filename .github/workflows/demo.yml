# Builds the Trestle playground (`apps/demo`) as a static site.
#
# Two stages, deliberately separate: the WebAssembly compiler is built from
# `crates/trestle-wasm`, then the Nuxt app is generated. The Nuxt build does not itself depend
# on the wasm having been produced — the app resolves it through `import.meta.glob`, so an
# absent package is an empty match rather than a resolve error — but a site published without
# it cannot compile anything, so a failure in the wasm step must fail the job.

name: demo

on:
  push:
    branches: [main]
    paths: ['apps/demo/**', 'crates/**', '.github/workflows/demo.yml']
  pull_request:
    paths: ['apps/demo/**', 'crates/**', '.github/workflows/demo.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/demo/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: jetli/wasm-pack-action@v0.4.0

      - run: pnpm install --frozen-lockfile

      - name: Build the WebAssembly compiler
        run: pnpm build:wasm

      # `wire-fixtures.ts` is written by the Rust test from the real DTOs, and the app
      # type-checks against it. If a change to `dto.rs` was not mirrored in `types.ts`, one of
      # these two steps fails — the diff here, or `pnpm typecheck` below.
      - name: Check the wire format is in step with the compiler
        run: |
          cargo test -p trestle-wasm --test wire_format
          git diff --exit-code -- app/lib/compiler/wire-fixtures.ts

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: demo-static
          path: apps/demo/.output/public
